<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOODIE រៀនលេង</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#000; --wood:#8A5226; --tan:#D9A066; --leaf:#4F7A2A; --leaf-d:#3C6020;
  --bg:#F2F4EA; --card:#fff; --text:#3A2A1C; --muted:#7A6C5E; --line:#DDE2CF;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Kantumruy Pro","Khmer OS Battambang","Noto Sans Khmer",system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px;-webkit-tap-highlight-color:transparent}
header{background:var(--ink);text-align:center;padding:14px 16px 10px}
header img{width:150px;max-width:50%;height:auto;display:block;margin:0 auto}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1.5px solid var(--leaf);background:transparent;color:var(--leaf-d);font:600 14px inherit;font-family:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--leaf);color:#fff}
nav button:focus-visible,.add:focus-visible,.bar button:focus-visible,.qty button:focus-visible,.order:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
main{padding:14px 12px;max-width:760px;margin:0 auto}
h2{font-size:18px;color:var(--wood);margin:6px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:linear-gradient(135deg,#EBCB9C,#D9A066);display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.info{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;font-weight:600;line-height:1.35}
.desc{font-size:12.5px;color:var(--muted);line-height:1.4}
.desc.en{font-size:12px}
.age{align-self:flex-start;font-size:12px;font-weight:600;color:var(--leaf-d);background:#E4ECD3;border-radius:999px;padding:2px 10px}
.price{font-size:17px;font-weight:700;color:var(--wood);margin-top:auto}
.add{border:0;background:var(--leaf);color:#fff;font:600 14px inherit;font-family:inherit;padding:9px;border-radius:10px;cursor:pointer}
.add:active{background:var(--leaf-d)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between;gap:10px;z-index:8}
.bar.show{display:flex}
.bar b{font-size:16px}
.bar button{border:0;background:var(--tan);color:var(--ink);font:700 15px inherit;font-family:inherit;padding:10px 18px;border-radius:10px;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.panel h3{font-size:18px;color:var(--wood);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{border:0;background:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;font-size:14px;font-weight:600}
.row .n small{display:block;color:var(--muted);font-weight:400}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--leaf);background:#fff;color:var(--leaf-d);font-size:18px;line-height:1;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:14px 0 4px}
.note{font-size:13px;color:var(--muted);margin-bottom:12px}
.order{width:100%;border:0;background:var(--leaf);color:#fff;font:700 16px inherit;font-family:inherit;padding:14px;border-radius:12px;cursor:pointer}
.empty{padding:26px 0;text-align:center;color:var(--muted)}
.form{display:grid;gap:6px;margin:12px 0 6px}
.form label{font-size:13px;font-weight:600;color:var(--wood);margin-top:4px}
.form input,.form textarea{width:100%;font-size:16px;font-family:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
.form input:focus,.form textarea:focus{outline:3px solid var(--tan);border-color:var(--leaf)}
.err{color:#B3261E;font-size:13px;font-weight:600;min-height:18px;margin:6px 0}

.ph{cursor:pointer}
.more{position:absolute;right:6px;bottom:6px;z-index:1;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.more[hidden]{display:none}
.lb{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;color:#fff}
.lb.show{display:flex}
.lbtop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.lbtop span{font-weight:600;font-size:15px}
.lbtop button{flex:none;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;line-height:1}
.lbbody{position:relative;flex:1;min-height:0}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;background:#111}
.slide img{max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:28px;cursor:pointer;z-index:2}
.nav.prev{left:0;border-radius:0 10px 10px 0}
.nav.next{right:0;border-radius:10px 0 0 10px}
.nav[hidden],.dots[hidden]{display:none}
.dots{display:flex;justify-content:center;gap:7px;padding:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:var(--tan)}
.lbfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.lbfoot b{font-size:18px;color:var(--tan)}
.lbfoot .add{padding:11px 20px;font-size:15px}
.lb button:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 16px 20px}
footer a{color:var(--leaf-d);font-weight:600}
</style>
</head>
<body>
<header><img src="logo.png" alt="WOODIE រៀនលេង"></header>
<nav id="tabs" aria-label="Categories"></nav>
<main id="list"></main>
<footer>
  ទាក់ទងយើង · Contact us:
  <a href="https://t.me/NopRavy7" id="contact">Telegram</a>
</footer>

<div class="bar" id="bar"><b id="barText"></b><button id="openCart">មើលកន្ត្រក · View cart</button></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>


<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Product photos">
  <div class="lbtop"><span id="lbTitle"></span><button id="lbClose" aria-label="Close">×</button></div>
  <div class="lbbody">
    <div class="track" id="track"></div>
    <button class="nav prev" id="prev" aria-label="Previous photo" hidden>‹</button>
    <button class="nav next" id="next" aria-label="Next photo" hidden>›</button>
  </div>
  <div class="dots" id="dots" hidden></div>
  <div class="lbfoot"><b id="lbPrice"></b><button class="add" id="lbAdd">បន្ថែម · Add</button></div>
</div>
<script>
// ====== EDIT HERE ======
var CONTACT = "NopRavy7";      // Telegram username that receives orders (no @)
var CATEGORIES = [
  {id:"wood",  km:"ក្មេងលេងឈើ",       en:"Wooden Toys",       icon:"🧸"},
  {id:"learn", km:"ល្បែងរៀន និង Puzzle", en:"Puzzles & Learning", icon:"🧩"},
  {id:"book",  km:"សៀវភៅ Busy Book",   en:"Busy Books",        icon:"📘"}
];
// image: put a photo named like "images/tool-box.jpg" in the images folder to show a real photo
var PRODUCTS = [
  {id:"tool-box", age:"3–7", km:"ប្រអប់ឧបករណ៍ឈើ សម្រាប់លេងជាជាងជួសជុល", en:"Wooden tool box with play tools and shapes",     cat:"wood",  name:"Wooden Tool Box",             price:13.5, icon:"🧰"},
  {id:"eight-set", age:"3–6", km:"ឈុតក្មេងលេងឈើសម្រាប់រៀន៖ លេខ រូបរាង នាឡិកា និងច្រើនទៀត", en:"Wooden learning set: numbers, shapes, clock and more",    cat:"wood",  name:"8-Set Wooden Toys",           price:10,   icon:"🪵"},
  {id:"treasure-box", age:"3–6", km:"ប្រអប់ឈើ ៥ ផ្ទៃ មានល្បែងលេងច្រើនក្នុងមួយ", en:"Five-sided wooden activity box with many games", cat:"wood",  name:"Five-Side Treasure Box",      price:14.5, icon:"🎁"},
  {id:"breakfast", age:"3–7", km:"ឈុតអាហារពេលព្រឹកធ្វើពីឈើ សម្រាប់លេងធ្វើម្ហូប", en:"Wooden breakfast set for pretend cooking",    cat:"wood",  name:"Breakfast Play Set",          price:14.5, icon:"🍳"},
  {id:"dog-gopher", age:"3–6", km:"ល្បែងវាយញញួរ និងឧបករណ៍ភ្លេង ក្នុងក្មេងលេងតែមួយ", en:"Hammer game and xylophone in one toy",   cat:"wood",  name:"Multi-Functional Dog Gopher", price:17,   icon:"🐶"},
  {id:"animal-balance", age:"3–6", km:"ដាក់តម្រៀប និងរក្សាតុល្យភាពសត្វឈើ", en:"Stack and balance wooden animals",cat:"wood", name:"Animal Balance",              price:8,    icon:"🐘"},
  {id:"nut-tool-set", age:"3–7", km:"តុជាងឈើ មានឧបករណ៍សម្រាប់លេងជាជាង", en:"Wooden workbench with play tools", cat:"wood",  name:"Nut Combination Tool Set",    price:17.5, icon:"🔩"},
  {id:"movement-maze", age:"3–6", km:"ល្បែងម៉ាញេទិច ដឹកគ្រាប់ពណ៌តាមផ្លូវ", en:"Magnetic maze: guide colored beads along the path",cat:"learn", name:"Movement Maze",               price:5,    icon:"🌀"},
  {id:"cognitive-board", age:"3–6", km:"ក្តារផ្គុំរូបឈើ មានលេខ និងរូបភាព", en:"Wooden puzzle boards with numbers and pictures",cat:"learn",name:"Cognitive Puzzle Board",     price:4.5,  icon:"🧠"},
  {id:"shape-puzzle", age:"3–6", km:"ក្តារផ្គុំរូបរាងធរណីមាត្រ", en:"Shape matching puzzle boards", cat:"learn", name:"Wooden Shape Puzzle",         price:6.5,  icon:"🔷"},
  {id:"geo-4in1", age:"3–6", km:"ឈុតតម្រៀបលេខ និងរូបរាង ៤ក្នុង១ មានឧបករណ៍ភ្លេង", en:"4-in-1 numbers, shapes, sorting and xylophone",     cat:"learn", name:"4-in-1 Geometric Shapes Set", price:9.5,  icon:"📐"},
  {id:"puzzle-22", age:"3–6", km:"ល្បែងផ្គុំរូបឈើ សត្វ និងយានយន្ត ពណ៌ស្រស់", en:"Colorful wooden animal and vehicle puzzles",    cat:"learn", name:"22-Style Wooden Puzzle",      price:4.5,  icon:"🧩"},
  {id:"puzzle-3d", age:"3–6", km:"ក្តារផ្គុំរូបឈើ 3D មានរូបរាងផ្សេងៗ", en:"3D wooden puzzle boards with shapes",    cat:"learn", name:"3D Puzzle Board",             price:6.5,  icon:"🧊"},
  {id:"busy-book", age:"3–6", km:"សៀវភៅសកម្មភាព Busy Book សម្រាប់រៀនលេង", en:"Busy book with learning activities",    cat:"book",  name:"Busy Book",                   price:5,    icon:"📘"},
  {id:"mini-busy", age:"3–6", km:"Busy Book តូច សម្រាប់យកទៅលេងគ្រប់ទីកន្លែង", en:"Small busy book to take anywhere",    cat:"book",  name:"Mini Quiet Busy Book",        price:5,    icon:"📗"},
  {id:"busy-book-l", age:"3–6", km:"Busy Book ធំ មានលេខ រូបភាព និងសកម្មភាពច្រើន", en:"Large busy book with numbers, pictures and activities",  cat:"book",  name:"Busy Book (Large)",           price:10,   icon:"📙"}
];
// =======================

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
var cart = {}, current = "all";
var form = {name:"", phone:"", address:"", note:""};
try {
  var saved = JSON.parse(localStorage.getItem("woodie_form") || "{}");
  form.name = saved.name || ""; form.phone = saved.phone || ""; form.address = saved.address || "";
} catch(e) {}
if (!form.name && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
  form.name = ((tg.initDataUnsafe.user.first_name||"") + " " + (tg.initDataUnsafe.user.last_name||"")).trim();
}
var $ = function(id){ return document.getElementById(id); };
function money(n){ return "$" + (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,""); }
function find(id){ return PRODUCTS.filter(function(p){return p.id===id;})[0]; }

function renderTabs(){
  var h = '<button data-c="all" class="'+(current==="all"?"on":"")+'">ទាំងអស់ · All</button>';
  CATEGORIES.forEach(function(c){
    h += '<button data-c="'+c.id+'" class="'+(current===c.id?"on":"")+'">'+c.icon+' '+c.km+'</button>';
  });
  $("tabs").innerHTML = h;
}
function renderList(){
  var h = "";
  CATEGORIES.forEach(function(c){
    if (current!=="all" && current!==c.id) return;
    var items = PRODUCTS.filter(function(p){return p.cat===c.id;});
    if(!items.length) return;
    h += '<h2>'+c.icon+' '+c.km+' · '+c.en+'</h2><div class="grid">';
    items.forEach(function(p){
      h += '<div class="card"><div class="ph" data-open="'+p.id+'" role="button" tabindex="0" aria-label="View photos of '+p.name+'">'+p.icon+'<span class="more" id="more-'+p.id+'" hidden>📷</span>'+
        '<img src="images/'+p.id+'.jpg" alt="'+p.name+'" loading="lazy" onerror="this.remove()"></div>'+
        '<div class="info"><div class="name">'+p.name+'</div>'+
        '<div class="desc">'+p.km+'</div><div class="desc en">'+p.en+'</div>'+
        '<div class="age">🎈 '+p.age+' ឆ្នាំ · yrs</div><div class="price">'+money(p.price)+'</div>'+
        '<button class="add" data-add="'+p.id+'">បន្ថែម · Add</button></div></div>';
    });
    h += '</div>';
  });
  $("list").innerHTML = h;
}
function count(){ var n=0; for(var k in cart) n+=cart[k]; return n; }
function total(){ var t=0; for(var k in cart) t+=cart[k]*find(k).price; return t; }
function renderBar(){
  var n = count();
  $("bar").classList.toggle("show", n>0);
  $("barText").textContent = n + " · " + money(total());
}
function renderCart(){
  var h = '<h3>កន្ត្រកទំនិញ · Your cart <button id="close" aria-label="Close">×</button></h3>';
  var keys = Object.keys(cart);
  if(!keys.length){ h += '<div class="empty">កន្ត្រកទទេ · Your cart is empty</div>'; }
  else {
    keys.forEach(function(k){
      var p = find(k);
      h += '<div class="row"><div class="n">'+p.name+'<small>'+money(p.price)+'</small></div>'+
        '<div class="qty"><button data-minus="'+k+'" aria-label="Less">−</button><b>'+cart[k]+'</b>'+
        '<button data-plus="'+k+'" aria-label="More">+</button></div></div>';
    });
    h += '<div class="total"><span>សរុប · Total</span><span>'+money(total())+'</span></div>'+
      '<div class="note">ថ្លៃដឹកជញ្ជូនយើងនឹងបញ្ជាក់ជាមួយអ្នក · Delivery cost is confirmed with you.</div>'+
      '<div class="form">'+
      '<label for="f-name">ឈ្មោះ · Name *</label><input id="f-name" data-f="name" autocomplete="name">'+
      '<label for="f-phone">លេខទូរស័ព្ទ · Phone *</label><input id="f-phone" data-f="phone" type="tel" inputmode="tel" autocomplete="tel">'+
      '<label for="f-address">អាសយដ្ឋាន · Address *</label><textarea id="f-address" data-f="address" rows="2" autocomplete="street-address"></textarea>'+
      '<label for="f-note">កំណត់ចំណាំ · Note</label><textarea id="f-note" data-f="note" rows="2"></textarea>'+
      '</div><div class="err" id="err"></div>'+
      '<button class="order" id="send">បញ្ជាទិញ · Place order</button>';
  }
  $("panel").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-f]"), function(el){ el.value = form[el.dataset.f] || ""; });
}
function sendOrder(){
  var digits = (form.phone || "").replace(/\D/g, "");
  if (!form.name.trim() || !form.address.trim() || digits.length < 8) {
    $("err").textContent = "សូមបំពេញឈ្មោះ លេខទូរស័ព្ទ និងអាសយដ្ឋាន · Please fill in your name, phone number and address.";
    return;
  }
  try { localStorage.setItem("woodie_form", JSON.stringify({name:form.name, phone:form.phone, address:form.address})); } catch(e) {}
  var details = {name:form.name.trim().slice(0,80), phone:form.phone.trim().slice(0,30),
                 address:form.address.trim().slice(0,300), note:(form.note||"").trim().slice(0,300)};
  // Opened from the bot's "Open Shop" button (link has ?src=kb): send the order straight to the bot
  if (tg && location.search.indexOf("src=kb") > -1) {
    var items = Object.keys(cart).map(function(k){ var p = find(k); return {n:p.name, q:cart[k], p:p.price}; });
    try { tg.sendData(JSON.stringify({name:details.name, phone:details.phone, address:details.address, note:details.note, items:items})); return; } catch(e) {}
  }
  var lines = ["សួស្តី! ខ្ញុំចង់បញ្ជាទិញពី WOODIE រៀនលេង / Hello! I would like to order from WOODIE:",""];
  Object.keys(cart).forEach(function(k){
    var p = find(k);
    lines.push(cart[k] + " x " + p.name + " = " + money(cart[k]*p.price));
  });
  lines.push("", "Total: " + money(total()), "", "Name: " + details.name, "Phone: " + details.phone, "Address: " + details.address);
  if (details.note) lines.push("Note: " + details.note);
  var url = "https://t.me/" + CONTACT + "?text=" + encodeURIComponent(lines.join("\n"));
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
}


// ---------- Photo viewer ----------
// Extra photos: put files named  <id>-2.jpg, <id>-3.jpg ... (up to -12) in the images folder. They show up automatically.
var photoCache = {}, lbId = null, lbCount = 0, lbIndex = 0;
function probe(url, ok, fail){ var im = new Image(); im.onload = ok; im.onerror = fail; im.src = url; }
function loadPhotos(id, cb){
  if (photoCache[id]) { cb(photoCache[id]); return; }
  var list = ["images/" + id + ".jpg"], n = 2;
  (function next(){
    if (n > 12) { photoCache[id] = list; cb(list); return; }
    var u = "images/" + id + "-" + n + ".jpg";
    probe(u, function(){ list.push(u); n++; next(); }, function(){ photoCache[id] = list; cb(list); });
  })();
}
function markMore(){
  PRODUCTS.forEach(function(p){
    probe("images/" + p.id + "-2.jpg", function(){ var b = $("more-" + p.id); if (b) b.hidden = false; }, function(){});
  });
}
function showDots(i){
  lbIndex = i;
  Array.prototype.forEach.call($("dots").children, function(d, k){ d.className = k === i ? "on" : ""; });
}
function buildSlides(list){
  lbCount = list.length;
  $("track").innerHTML = list.map(function(u){ return '<div class="slide"><img src="' + u + '" alt=""></div>'; }).join("");
  $("dots").innerHTML = list.map(function(){ return "<i></i>"; }).join("");
  var many = list.length > 1;
  $("dots").hidden = !many; $("prev").hidden = !many; $("next").hidden = !many;
  $("track").scrollLeft = 0; showDots(0);
}
function openViewer(id){
  var p = find(id); if (!p) return;
  lbId = id;
  $("lbTitle").textContent = p.name; $("lbPrice").textContent = money(p.price);
  $("lbAdd").textContent = "បន្ថែម · Add";
  $("lb").classList.add("show"); document.body.style.overflow = "hidden";
  buildSlides(["images/" + id + ".jpg"]);
  loadPhotos(id, function(list){ if (lbId === id && list.length > 1) buildSlides(list); });
  if (tg && tg.BackButton) { try { tg.BackButton.offClick(closeViewer); tg.BackButton.onClick(closeViewer); tg.BackButton.show(); } catch(e) {} }
}
function closeViewer(){
  $("lb").classList.remove("show"); document.body.style.overflow = ""; lbId = null;
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
}
function goPhoto(step){
  var t = $("track"), i = Math.max(0, Math.min(lbCount - 1, lbIndex + step));
  t.scrollTo({left: i * t.clientWidth, behavior: "smooth"});
}
$("track").addEventListener("scroll", function(){
  var t = $("track"); if (t.clientWidth) showDots(Math.round(t.scrollLeft / t.clientWidth));
});
document.addEventListener("keydown", function(e){
  if (!$("lb").classList.contains("show")) {
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.open) { e.preventDefault(); openViewer(e.target.dataset.open); }
    return;
  }
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowLeft") goPhoto(-1);
  else if (e.key === "ArrowRight") goPhoto(1);
});

document.addEventListener("click", function(e){
  var ph = e.target.closest("[data-open]"); if (ph) { openViewer(ph.dataset.open); return; }
  var t = e.target.closest("button"); if(!t) return;
  if (t.id === "lbClose") { closeViewer(); return; }
  if (t.id === "prev") { goPhoto(-1); return; }
  if (t.id === "next") { goPhoto(1); return; }
  if (t.id === "lbAdd") {
    cart[lbId] = (cart[lbId] || 0) + 1; renderBar();
    t.textContent = "✓ បានបន្ថែម · Added";
    setTimeout(function(){ if (t) t.textContent = "បន្ថែម · Add"; }, 1200);
    return;
  }
  if (t.dataset.c) { current = t.dataset.c; renderTabs(); renderList(); markMore(); window.scrollTo({top:0}); }
  else if (t.dataset.add) { cart[t.dataset.add]=(cart[t.dataset.add]||0)+1; renderBar(); if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred("light");}catch(x){}} }
  else if (t.dataset.plus) { cart[t.dataset.plus]++; renderCart(); renderBar(); }
  else if (t.dataset.minus) { cart[t.dataset.minus]--; if(cart[t.dataset.minus]<=0) delete cart[t.dataset.minus]; renderCart(); renderBar(); }
  else if (t.id==="openCart") { renderCart(); $("sheet").classList.add("show"); }
  else if (t.id==="close") { $("sheet").classList.remove("show"); }
  else if (t.id==="send") { sendOrder(); }
});
document.addEventListener("input", function(e){
  var f = e.target.dataset && e.target.dataset.f;
  if (f) { form[f] = e.target.value; var er = $("err"); if (er) er.textContent = ""; }
});
$("sheet").addEventListener("click", function(e){ if(e.target===$("sheet")) $("sheet").classList.remove("show"); });
$("contact").href = "https://t.me/" + CONTACT;
renderTabs(); renderList(); renderBar(); markMore();
</script>
</body>
</html>
